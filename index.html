<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View 365</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #eef1f5;
  --bg2:         #ffffff;
  --fg:          #1e2433;
  --muted:       #8a96a8;
  --border:      #c8d4e2;
  --weekend:     #eef2f7;
  --hover:       #e6eaf0;
  --today-bg:    #2563eb;
  --today-fg:    #ffffff;
  --hdr-bg:      #edf5ff;
  --hdr-fg:      #0f1923;
  --lbl-bg:      #edf5ff;
  --lbl-fg:      #0f1923;
  --invalid-bg:  #f5f7fa;
  --past-bg:     #e3e7ed;
  /* header chrome — adapts to light header */
  --hdr-border:       rgba(0,0,0,0.14);
  --hdr-hover:        rgba(0,0,0,0.07);
  --hdr-hover-border: rgba(0,0,0,0.24);
  --hdr-muted:        rgba(0,0,0,0.38);
  --hdr-track:        rgba(0,0,0,0.15);
  --hdr-thumb:        rgba(0,0,0,0.4);
  --accent:       #2563eb;
  --accent-soft:  #dbeafe;
  --shadow-sm:    0 1px 2px rgba(15,23,42,.06);
  --shadow-md:    0 12px 32px rgba(15,23,42,.14);
  --row-h: 85px;
  --col-w: 44px;
}

body.dark {
  --bg:          #2a3a58;
  --bg2:         #334468;
  --fg:          #edf4ff;
  --muted:       #98b0cc;
  --border:      #4e6585;
  --weekend:     #2e4068;
  --hover:       #3a5080;
  --today-bg:    #2563eb;
  --today-fg:    #ffffff;
  --hdr-bg:      #2e4878;
  --hdr-fg:      #eaf4ff;
  --lbl-bg:      #2e4878;
  --lbl-fg:      #eaf4ff;
  --invalid-bg:  #263860;
  --past-bg:     #293956;
  /* header chrome — adapts to dark header */
  --hdr-border:       rgba(255,255,255,0.15);
  --hdr-hover:        rgba(255,255,255,0.1);
  --hdr-hover-border: rgba(255,255,255,0.28);
  --hdr-muted:        rgba(255,255,255,0.35);
  --hdr-track:        rgba(255,255,255,0.18);
  --hdr-thumb:        rgba(255,255,255,0.75);
}

html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--fg);
}

/* ─────────────── HEADER BAR ─────────────── */
.hdr {
  position: sticky; top: 0; z-index: 200;
  background: var(--hdr-bg); color: var(--hdr-fg);
  display: flex; align-items: center;
  padding: 0 16px; min-height: 56px; gap: 14px;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.hdr-left  { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.hdr-mid   { display: flex; align-items: center; gap: 14px; flex: 1; justify-content: center; }
.hdr-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hdr h1 { font-size: 14px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hdr-fg); }
.hdr-nav { display: flex; align-items: center; gap: 6px; }
.hdr-nav button {
  background: none; border: 1px solid var(--hdr-border); border-radius: 5px;
  color: var(--hdr-fg); width: 28px; height: 28px;
  font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, border-color 0.12s;
}
.hdr-nav button:hover { background: var(--hdr-hover); border-color: var(--hdr-hover-border); }
.hdr-year { font-size: 15px; font-weight: 600; min-width: 40px; text-align: center; }
.hdr-btn {
  background: none; border: 1px solid var(--hdr-border); border-radius: 5px;
  color: var(--hdr-fg); padding: 5px 11px;
  font-size: 11px; cursor: pointer; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}
.hdr-btn:hover { background: var(--hdr-hover); border-color: var(--hdr-hover-border); }
.hdr-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--fg); font-weight:700; }
.hdr-btn:focus-visible, .hdr-nav button:focus-visible, .signin-btn:focus-visible {
  outline: 3px solid rgba(37,99,235,.35); outline-offset: 2px;
}
.view-switch { display:flex; align-items:center; padding:3px; border:1px solid var(--hdr-border); border-radius:8px; background:rgba(255,255,255,.25); }
.view-btn { border:0; background:transparent; color:var(--hdr-fg); padding:5px 10px; border-radius:5px; font-size:11px; cursor:pointer; }
.view-btn.active { background:var(--bg2); box-shadow:var(--shadow-sm); font-weight:700; color:var(--fg); }
.user-email { color: var(--hdr-muted); font-size: 11px; }
.year-progress { width:132px; display:flex; flex-direction:column; gap:4px; }
.year-progress-text { font-size:10px; font-weight:650; color:var(--hdr-muted); white-space:nowrap; }
.year-progress-track { height:3px; overflow:hidden; border-radius:999px; background:var(--hdr-track); }
.year-progress-fill { height:100%; border-radius:inherit; background:var(--accent); }

/* ─────────────── ZOOM SLIDER ─────────────── */
.zoom-ctrl { display: flex; align-items: center; gap: 7px; }
.zoom-lbl  { font-size: 10px; color: var(--hdr-muted); min-width: 50px; text-align: center; white-space: nowrap; }
.zoom-end  { font-size: 11px; color: var(--hdr-muted); user-select: none; }
.zoom-slider {
  -webkit-appearance: none; appearance: none;
  width: 96px; height: 3px; background: var(--hdr-track); border-radius: 2px; outline: none; cursor: pointer;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; background: var(--hdr-thumb); cursor: pointer;
}
.zoom-slider::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%; border: none;
  background: var(--hdr-thumb); cursor: pointer;
}

/* ─────────────── CALENDAR PICKER ─────────────── */
.cal-picker { position: relative; }
.cal-drop {
  position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 0;
  min-width: 215px; max-height: 310px; overflow-y: auto;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35); z-index: 400;
}
.cal-drop-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 12px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--border);
}
.cal-drop-hdr .acts { display: flex; gap: 8px; }
.cal-drop-hdr button { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; }
.cal-drop-hdr button:hover { color: var(--fg); }
.cal-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 12px; cursor: pointer; font-size: 12px; color: var(--fg);
}
.cal-item:hover { background: var(--hover); }
.cal-item input[type=checkbox] { accent-color: #5b9cf6; cursor: pointer; flex-shrink: 0; }
.cal-swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.cal-name   { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─────────────── YEAR GRID (wall planner) ─────────────── */
/*
  Layout:  rows    = months (JAN → DEC)
           columns = days 1 → 31
  col 1  = month label (sticky left)
  col 2–32 = days 1–31
  row 1  = day-number header (sticky top)
  row 2–13 = month rows
*/
.year-grid {
  display: grid;
  grid-template-columns: 62px repeat(31, minmax(var(--col-w), 1fr));
  grid-template-rows: 36px repeat(12, var(--row-h));
  width: 100%;
  min-width: calc(62px + 31 * var(--col-w));
}

/* ── Corner cell (top-left) ── */
.g-corner {
  grid-column: 1; grid-row: 1;
  position: sticky; top: 52px; left: 0; z-index: 150;
  background: var(--hdr-bg);
  border-right: 2px solid var(--border);
  border-bottom: 2px solid var(--border);
  border-left: 2px solid var(--border);
  border-top: 2px solid var(--border);
}

/* ── Day-number header row ── */
.g-day-hdr {
  grid-row: 1;
  position: sticky; top: 52px; z-index: 120;
  background: var(--hdr-bg); color: var(--hdr-fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  border-right: 1px solid var(--border);
  border-bottom: 2px solid var(--border);
  line-height: 1.2;
}

/* ── Month label (left column) ── */
.g-month-lbl {
  grid-column: 1;
  position: sticky; left: 0; z-index: 100;
  background: var(--lbl-bg); color: var(--lbl-fg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  border-right: 2px solid var(--border);
  border-bottom: 1px solid var(--border);
  cursor: default;
  user-select: none;
  border-left: 0; border-top: 0; font-family: inherit;
}
.g-month-lbl:hover { filter:brightness(.98); cursor:pointer; }

/* ── Day cells ── */
.g-day {
  height: var(--row-h);
  min-height: 40px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 4px 5px;
  background: var(--bg2);
  cursor: pointer;
  overflow: hidden;
  transition: background 0.12s, box-shadow 0.12s;
}
.g-day:hover       { background: var(--hover); }
.g-day:has(.multi-part) { position:relative; z-index:4; overflow:visible; }
.g-day:has(.multi-start) { z-index:6; }
.g-day.wknd        { background: var(--weekend); }
.g-day.wknd:hover  { background: var(--hover); }
.g-day.today {
  outline: 3px solid #dc2626;
  outline-offset: -3px;
  background: var(--bg2) !important;
}
.g-day.today:hover { background: var(--hover) !important; }
.g-day.invalid {
  background: var(--invalid-bg);
  cursor: default;
  pointer-events: none;
}
.g-day.past { background:var(--past-bg); }
.g-day.past:hover { background:var(--hover); }

/* Day cell top row */
.g-day-top {
  display: flex; align-items: baseline; gap: 3px;
  margin-bottom: 3px;
}
.g-day-dow {
  font-size: 8px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--muted);
}
.g-day-num { font-size: 12px; font-weight: 600; }
.g-day.today .g-day-num { color: #dc2626; font-weight: 800; }

/* Events */
.g-day-events { display: flex; flex-direction: column; gap: 2px; }
.g-day-event {
  font-size: 10px; font-weight: 500;
  padding: 1px 4px; border-radius: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #fff; line-height: 1.4;
}
.g-day-event.multi-part { border-radius:0; margin-left:-5px; margin-right:-5px; padding-left:6px; padding-right:6px; }
.g-day-event.multi-start { border-radius:5px 0 0 5px; margin-left:0; }
.g-day-event.multi-end { border-radius:0 5px 5px 0; margin-right:0; }
.g-day-event.multi-mid, .g-day-event.multi-end { color:transparent; }
.g-day-event.multi-start { overflow:visible; text-overflow:clip; white-space:nowrap; text-shadow:0 1px 1px rgba(0,0,0,.18); }
.g-day-event.multi-start .multi-label { position:absolute; inset:0 auto 0 0; padding:1px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none; }
.g-day-event.allday.multi-mid, .g-day-event.allday.multi-end { border-left:0; }
.g-day-event.multi-part::after { content:''; position:absolute; inset:0; }
.g-day-event.multi-part { position:relative; z-index:2; }
.g-day-event.allday { border-left: 3px solid rgba(255,255,255,0.4); }
.g-day-event-slot { visibility:hidden; pointer-events:none; }
.g-more { font-size: 9px; color: var(--muted); padding: 0 3px; }

/* ── Quarter dividers (APR / JUL / OCT) ── */
.qtr-start { border-top: 3px solid var(--muted) !important; }

/* Dense mode — row height < 55px */
body.dense .g-day       { padding: 2px 3px; }
body.dense .g-day-dow   { display: none; }
body.dense .g-day-num   { font-size: 10px; }
body.dense .g-day-event { font-size: 9px !important; padding: 1px 3px !important; }
body.dense .g-day-top   { margin-bottom: 1px; }
body.dense .g-day-events { gap: 1px; }
body.dense .g-more      { font-size: 8px; }

/* ─────────────── SIGN-IN ─────────────── */
.signin-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: calc(100vh - 56px); gap: 18px; padding: 48px 24px;
}
.signin-wrap h2 { font-size: clamp(30px,4vw,48px); font-weight: 750; letter-spacing: -1.5px; text-align:center; }
.signin-wrap p  { color: var(--muted); font-size: 14px; text-align: center; }
.signin-btn {
  display: flex; align-items: center; gap: 10px;
  background: var(--fg); color: var(--bg);
  border: none; border-radius: 8px;
  padding: 12px 28px; font-size: 14px; font-weight: 500; cursor: pointer;
}
.signin-btn:hover { opacity: 0.85; }
.signin-kicker { color:var(--accent); text-transform:uppercase; font-size:11px; font-weight:800; letter-spacing:.14em; }
.signin-note { font-size:11px !important; }
.year-preview { width:min(760px,92vw); height:170px; margin-top:18px; padding:16px; overflow:hidden; border:1px solid var(--border); border-radius:16px; background:var(--bg2); box-shadow:var(--shadow-md); }
.preview-grid { display:grid; grid-template-columns:52px repeat(12,1fr); grid-template-rows:repeat(6,22px); gap:1px; opacity:.82; }
.preview-cell { background:var(--weekend); border-radius:2px; }
.preview-label { display:flex; align-items:center; font-size:7px; font-weight:800; letter-spacing:.1em; color:var(--muted); }
.preview-span { align-self:center; height:7px; border-radius:6px; background:var(--accent); }

/* Month view */
.month-shell { max-width:1200px; height:calc(100svh - var(--hdr-h, 56px)); margin:0 auto; padding:18px 24px 20px; display:flex; flex-direction:column; overflow:hidden; }
.month-title { display:flex; align-items:end; justify-content:space-between; margin-bottom:12px; flex:0 0 auto; }
.month-title h2 { font-size:28px; letter-spacing:-.7px; }
.month-title p { color:var(--muted); font-size:12px; }
.month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:auto repeat(6,minmax(0,1fr)); flex:1 1 auto; min-height:0; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--border); gap:1px; box-shadow:var(--shadow-sm); }
.month-dow { background:var(--hdr-bg); color:var(--muted); padding:9px 10px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; }
.month-day { position:relative; min-height:0; padding:7px 9px; background:var(--bg2); cursor:pointer; overflow:hidden; }
.month-day:hover { background:var(--hover); }
.month-day.outside { background:var(--invalid-bg); color:var(--muted); }
.month-day.today { box-shadow:inset 0 0 0 2px #dc2626; }
.month-num { font-size:12px; font-weight:700; margin-bottom:8px; }
.month-events { display:flex; flex-direction:column; gap:4px; }
.month-event { padding:4px 6px; border-radius:5px; color:#fff; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.month-event.multi-part { position:relative; z-index:2; border-radius:0; margin-left:-9px; margin-right:-10px; padding-left:10px; padding-right:10px; overflow:visible; text-overflow:clip; }
.month-event.multi-start { margin-left:0; border-radius:5px 0 0 5px; }
.month-event.multi-end { margin-right:0; border-radius:0 5px 5px 0; }
.month-event.multi-mid, .month-event.multi-end { color:transparent; }
.month-event.multi-start { text-shadow:0 1px 1px rgba(0,0,0,.18); }
.month-event-slot { visibility:hidden; pointer-events:none; }
.month-day:has(.month-event.multi-part) { overflow:visible; z-index:2; }
.month-day:has(.month-event.multi-start) { z-index:3; }

@media (max-width: 760px) {
  .hdr { position:sticky; display:grid; grid-template-columns:1fr auto; height:auto; padding:9px 12px; gap:8px; }
  .hdr-left { gap:8px; min-width:0; }
  .hdr h1 { font-size:12px; }
  .hdr-mid { grid-column:1 / -1; grid-row:2; width:100%; justify-content:space-between; overflow-x:auto; gap:8px; }
  .hdr-right { grid-column:2; grid-row:1; }
  .user-email, .zoom-lbl, .zoom-end, .zoom-slider, .desktop-only { display:none !important; }
  .year-progress { width:82px; }
  .year-progress-text { font-size:9px; }
  .view-switch { order:-1; }
  .year-grid { grid-template-columns:52px repeat(31,34px); min-width:1106px; }
  .g-corner, .g-day-hdr { top:96px; }
  .g-day-event.multi-part { margin-left:-3px; margin-right:-3px; }
  .month-shell { padding:12px 10px 14px; }
  .month-title h2 { font-size:22px; }
  .month-title p { display:none; }
  .month-grid { border-radius:8px; }
  .month-dow { padding:7px 4px; text-align:center; }
  .month-day { min-height:82px; padding:6px 4px; }
  .month-event { font-size:9px; padding:3px 4px; }
  .month-event.multi-part { margin-left:-4px; margin-right:-5px; padding-left:5px; padding-right:5px; }
  .month-event.multi-start { margin-left:0; }
  .month-event.multi-end { margin-right:0; }
  .year-preview { height:145px; }
}

/* ─────────────── LOADING ─────────────── */
.loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh; gap: 14px;
  color: var(--muted); font-size: 14px;
}
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border); border-top-color: var(--fg);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─────────────── MODAL ─────────────── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 900;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 22px;
  max-width: 400px; width: 90%; max-height: 72vh; overflow-y: auto;
  box-shadow: 0 10px 44px rgba(0,0,0,0.22);
}
.modal h3     { font-size: 14px; font-weight: 600; margin-bottom: 14px; padding-right: 24px; }
.modal-x      { float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.modal-x:hover { color: var(--fg); }
.ev           { padding: 9px 0; border-bottom: 1px solid var(--border); }
.ev:last-child { border-bottom: none; }
.ev-title     { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
.ev-dot       { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ev-meta      { font-size: 11px; color: var(--muted); margin-top: 3px; padding-left: 14px; }

/* ─────────────── LEGEND ─────────────── */
.legend {
  padding: 10px 20px; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 14px;
  font-size: 11px; color: var(--muted); background: var(--bg2);
}
.leg-item { display: flex; align-items: center; gap: 5px; }
.leg-dot  { width: 8px; height: 8px; border-radius: 50%; }

/* ─────────────── HOVER TOOLTIP ─────────────── */
#tip {
  position: fixed; z-index: 800;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px;
  min-width: 160px; max-width: 260px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  pointer-events: none; font-size: 12px;
}
.tip-date { font-weight: 700; font-size: 11px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
.tip-ev   { display: flex; align-items: center; gap: 6px; padding: 2px 0; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tip-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.tip-more { font-size: 10px; color: var(--muted); margin-top: 3px; }

/* ─────────────── PRINT ─────────────── */
@media print {
  .hdr { position: static !important; }
  .g-corner, .g-day-hdr { position: static !important; }
  .g-month-lbl { position: static !important; writing-mode: horizontal-tb; transform: none; }
  .cal-drop, .zoom-ctrl { display: none !important; }
}
</style>
</head>
<body>

<div id="tip" style="display:none;"></div>
<div class="hdr">
  <div class="hdr-left">
    <h1>View 365</h1>
    <div class="hdr-nav">
      <button onclick="changePeriod(-1)" aria-label="Previous period">‹</button>
      <span class="hdr-year" id="yearLabel">2026</span>
      <button onclick="changePeriod(1)" aria-label="Next period">›</button>
    </div>
    <div id="yearProgress"></div>
  </div>

  <div class="hdr-mid" id="hdrMid">
    <div class="zoom-ctrl">
      <span class="zoom-end">−</span>
      <input type="range" class="zoom-slider" id="zoomSlider"
             min="45" max="200" value="85"
             oninput="setRowH(+this.value)">
      <span class="zoom-end">+</span>

}

  if (!dt) return '';
  let h = dt.getHours(), m = dt.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';

// ── Zoom (scales row height + column width together) ──
function applyZoom(z) {
  zoom = Math.max(45, Math.min(200, z));
  const rowH = zoom;
  const colW = Math.max(28, Math.round(zoom * 0.52));
  document.documentElement.style.setProperty('--row-h', rowH + 'px');
  document.documentElement.style.setProperty('--col-w', colW + 'px');
  document.body.classList.toggle('dense', zoom < 55);
  localStorage.setItem('v365_zoom', zoom);
  const s = document.getElementById('zoomSlider'); if (s) s.value = zoom;
  const l = document.getElementById('zoomLbl');    if (l) l.textContent = zoom + '%';
}
function setRowH(z) { applyZoom(z); }

// ── Fit controls ──
function widthFitZoom() {
  // Width fit: 62px (month col) + 31 * col-w fills viewport width
  const availW = window.innerWidth - 4;
  const targetColW = Math.floor((availW - 62) / 31);
  return Math.round(targetColW / 0.52);
}

function fitToWidth() {
  applyZoom(widthFitZoom());
  window.scrollTo({ left: 0, behavior: 'smooth' });
}

function fitToScreen() {
  const zoomW = widthFitZoom();

  // Height fit: 52px (header) + 36px (day-row) + 12 * row-h + 38px (legend) = viewport height
  // row-h = zoom, so: zoom = (availH - 126) / 12
  const availH = window.innerHeight - 52 - 36 - 38;
  const zoomH = Math.floor(availH / 12);

  // Use the smaller of the two so everything fits in both dimensions
  applyZoom(Math.min(zoomW, zoomH));
}

function toggleFadePast() {

function yearProgressData(displayYear = year) {
  const now = new Date();
  const total = new Date(displayYear, 1, 29).getMonth() === 1 ? 366 : 365;
  let day = 0;
  if (displayYear < now.getFullYear()) day = total;
  else if (displayYear === now.getFullYear()) {
    day = Math.floor((Date.UTC(displayYear, now.getMonth(), now.getDate()) - Date.UTC(displayYear, 0, 1)) / 86400000) + 1;
  }
  return { day, total, pct: day / total * 100 };
}

// ── API ──
async function gf(url) {
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) { signOut(); throw new Error('expired'); }
  return r;
}
async function fetchAllEvents() {
  const requestId = ++fetchSeq;
  const nextEvts = {};
  document.getElementById('app').innerHTML =
    '<div class="loading"><div class="spinner"></div><p>Loading your year…</p></div>';
  try {
    const cr = await gf('https://www.googleapis.com/calendar/v3/users/me/calendarList');
    const cd = await cr.json();
    cals = [...new Map((cd.items||[]).filter(c=>c.selected!==false)
      .map(c=>[c.id,{ id:c.id, name:c.summary||c.id, color:c.backgroundColor||'#555' }])).values()];

    const saved = localStorage.getItem('v365_cals');
    if (saved && !enabledCals) {
      try {
        const arr = JSON.parse(saved), valid = new Set(cals.map(c=>c.id));
        const ok = arr.filter(id=>valid.has(id));
        enabledCals = ok.length ? new Set(ok) : null;
      } catch(e) { enabledCals = null; }
    }

    const tMin = new Date(year, 0, 1).toISOString();
    const tMax = new Date(year, 11, 31, 23, 59, 59).toISOString();

    for (const cal of cals) {
      let pt = '';
      do {
        let url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events` +
          `?timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=2500&timeZone=America/Chicago`;
        if (pt) url += '&pageToken=' + pt;
        const er = await gf(url); const ed = await er.json();
        for (const ev of (ed.items||[])) {
          if (ev.status==='cancelled') continue;
          const allDay = !!ev.start.date;
          const sd = allDay ? parseLocalDate(ev.start.date) : new Date(ev.start.dateTime);
          const en = allDay ? parseLocalDate(ev.end.date)   : new Date(ev.end.dateTime);
          if (allDay) {
            const last = new Date(en); last.setDate(last.getDate()-1);
            for (let d=new Date(sd); d<en; d.setDate(d.getDate()+1))
              addEv(new Date(d),ev,cal,true,sd,last,nextEvts);
          } else { addEv(sd,ev,cal,false,sd,sd,nextEvts); }
        }
        pt = ed.nextPageToken || '';
      } while (pt);
    }
    if (requestId !== fetchSeq) return;
    evts = nextEvts;
    renderHdr(); viewMode === 'month' ? buildMonth() : buildGrid();
  } catch(e) {
    if (requestId !== fetchSeq) return;
    if (e.message!=='expired')
      document.getElementById('app').innerHTML =
        `<div class="loading"><p>Error loading calendar. <button onclick="fetchAllEvents()">Retry</button></p></div>`;
  }
}
function addEv(d, ev, cal, allDay, spanStart, spanEnd, store = evts) {
  if (d.getFullYear()!==year) return;
  const key=dk(d); if(!store[key]) store[key]=[];
  const id=ev.id || `${cal.id}-${ev.summary}-${dk(spanStart)}`;
  if (store[key].some(item => item.id === id && item.calId === cal.id)) return;
  store[key].push({ id, title:ev.summary||'(No title)',
    start:ev.start.dateTime?new Date(ev.start.dateTime):null, allDay, color:cal.color,
    calId:cal.id, calName:cal.name, location:ev.location||'', spanStart:dk(spanStart), spanEnd:dk(spanEnd) });
}

function spanClass(ev, key) {
  if (!ev.allDay || ev.spanStart === ev.spanEnd) return '';
  const [,m,d] = key.split('-').map(Number);
  const startsHere = key === ev.spanStart || d === 1;
  const daysInMonth = new Date(year, m, 0).getDate();
  const endsHere = key === ev.spanEnd || d === daysInMonth;
  return ` multi-part ${startsHere?'multi-start':''} ${endsHere?'multi-end':''} ${!startsHere&&!endsHere?'multi-mid':''}`;
}

function spanLabel(ev, key) {
  if (!ev.allDay || ev.spanStart === ev.spanEnd) return ev.title;
  const day = +key.slice(-2);
  return (key === ev.spanStart || day === 1) ? ev.title : '&nbsp;';
}

function monthSpanClass(ev, key) {
  if (!ev.allDay || ev.spanStart === ev.spanEnd) return '';
  const [y,m,d] = key.split('-').map(Number);
  const dow = new Date(y,m-1,d).getDay();
  const startsHere = key === ev.spanStart || dow === 0;
  const endsHere = key === ev.spanEnd || dow === 6;
  return ` multi-part ${startsHere?'multi-start':''} ${endsHere?'multi-end':''} ${!startsHere&&!endsHere?'multi-mid':''}`;
}

function monthSpanLabel(ev, key) {
  if (!ev.allDay || ev.spanStart === ev.spanEnd) return ev.title;
  const [y,m,d] = key.split('-').map(Number);
  return (key === ev.spanStart || new Date(y,m-1,d).getDay() === 0) ? ev.title : '&nbsp;';
}

function eventKey(ev) {
  return `${ev.calId}::${ev.id}`;
}

// Assign all-day events to shared lanes for an entire Sunday-Saturday row.
// Rendering each day independently lets a continuing bar move when a nearby
// event begins or ends, leaving its overflowed title detached from its color.
function monthWeekLanes(weekStart) {
  const byId = new Map();
  for (let offset=0; offset<7; offset++) {
    const date = new Date(weekStart); date.setDate(weekStart.getDate()+offset);
    (evts[dk(date)]||[]).filter(e=>e.allDay && isCalEnabled(e.calId))
      .forEach(ev=>byId.set(eventKey(ev),ev));
  }
  const lanes=[];
  [...byId.values()].sort(eventDisplaySort).forEach(ev=>{
    const start=Math.max(0,Math.round((new Date(`${ev.spanStart}T00:00:00`)-weekStart)/86400000));
    const end=Math.min(6,Math.round((new Date(`${ev.spanEnd}T00:00:00`)-weekStart)/86400000));
    let lane=0;
    while(lanes[lane]?.some(item=>item.start<=end && item.end>=start)) lane++;
    if(!lanes[lane]) lanes[lane]=[];
    lanes[lane].push({ev,start,end});
  });
  return lanes;
}

// Reserve the top lanes of each Year View month row for multi-day events.
// Without month-wide lanes, each day sorts independently and a continuing bar
// can jump vertically when a one-day or timed event begins beside it.
function yearMonthLanes(month) {
  const byId = new Map();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthStart = dk(new Date(year,month,1));
  const monthEnd = dk(new Date(year,month,daysInMonth));
  for (let day=1; day<=daysInMonth; day++) {
    const date = new Date(year, month, day);
    (evts[dk(date)]||[])
      .filter(e=>e.allDay && e.spanStart!==e.spanEnd && isCalEnabled(e.calId))
      .forEach(ev=>byId.set(eventKey(ev),ev));
  }
  const lanes=[];
  [...byId.values()].sort(eventDisplaySort).forEach(ev=>{
    const start=ev.spanStart<monthStart ? 1 : +ev.spanStart.slice(-2);
    const end=ev.spanEnd>monthEnd ? daysInMonth : +ev.spanEnd.slice(-2);
    let lane=0;
    while(lanes[lane]?.some(item=>item.start<=end && item.end>=start)) lane++;
    if(!lanes[lane]) lanes[lane]=[];
    lanes[lane].push({ev,start,end});
  });
  return lanes;
}

// Keep a continuing all-day event in the same visual lane when another event
// begins partway through its span. Google event IDs are not chronological, so
// sorting by ID can make a bar appear to jump or break between adjacent days.
function eventDisplaySort(a, b) {
  if (a.allDay !== b.allDay) return b.allDay - a.allDay;
  if (a.allDay) {
    return a.spanStart.localeCompare(b.spanStart) ||
      b.spanEnd.localeCompare(a.spanEnd) ||
      a.title.localeCompare(b.title) ||
      a.calName.localeCompare(b.calName) ||
      a.id.localeCompare(b.id);
  }
  return (a.start?.getTime() || 0) - (b.start?.getTime() || 0) ||
    a.title.localeCompare(b.title) || a.id.localeCompare(b.id);
}

// Multi-day titles start in the first segment but may read across the whole
// colored bar. Measure the actual responsive grid so the text clips precisely
// at the event's last segment instead of spilling into unrelated days.
function sizeYearSpanLabels() {
  document.querySelectorAll('.g-day-event.multi-start .multi-label').forEach(label=>{
    const startCell=label.closest('.g-day');
    const endCell=document.querySelector(`.g-day[data-month="${startCell.dataset.month}"][data-day="${label.dataset.endDay}"]`);
    if(!endCell) return;
    const left=label.getBoundingClientRect().left;
    const right=endCell.getBoundingClientRect().right-5;
    label.style.width=`${Math.max(0,right-left)}px`;
  });
}

// ── Build Wall Calendar Grid ──
function buildGrid() {
  const today = dk(new Date());
  let html = '<div class="year-grid" id="yearGrid">';

  // Corner
  html += '<div class="g-corner"></div>';

  // Day-number header row (cols 2–32)
  for (let d = 1; d <= 31; d++) {
    html += `<div class="g-day-hdr">${d}</div>`;
  }

  // 12 month rows
  for (let m = 0; m < 12; m++) {
    const isQtr = m === 3 || m === 6 || m === 9; // APR / JUL / OCT
    const multiLanes = yearMonthLanes(m);
    const MAX = 4;
    const reservedRows = Math.min(MAX,multiLanes.length);

    // Month label
    html += `<button class="g-month-lbl${isQtr ? ' qtr-start' : ''}" onclick="setView('month',${m})" title="Open ${MONS[m]} month view">${MONS[m]}</button>`;

    // 31 day cells
    for (let d = 1; d <= 31; d++) {
      const date  = new Date(year, m, d);
      const valid = date.getMonth() === m; // rolls to next month if invalid

      if (!valid) {
        html += `<div class="g-day invalid${isQtr ? ' qtr-start' : ''}"></div>`;
      } else {
        const key     = dk(date);
        const dow     = date.getDay();
        const isToday = key === today;
        const isPast  = date < new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
        const isWknd  = dow === 0 || dow === 6;
        const dayEvts = (evts[key] || []).filter(e => isCalEnabled(e.calId))
          .sort(eventDisplaySort);

        let cls = 'g-day';
        if (isQtr)       cls += ' qtr-start';
        if (isToday)     cls += ' today';
        else if (isWknd) cls += ' wknd';
        if (fadePast && isPast) cls += ' past';

        html += `<div class="${cls}" data-month="${m}" data-day="${d}" onclick="showModal('${key}')">`;
        html += '<div class="g-day-top">';
        html += `<span class="g-day-dow">${DOW_S[dow]}</span>`;
        html += `<span class="g-day-num">${d}</span>`;
        html += '</div>';

        if (dayEvts.length) {
          html += '<div class="g-day-events">';
          let shown = 0;
          for (let lane=0; lane<reservedRows; lane++) {
            const item=multiLanes[lane].find(candidate=>candidate.start<=d && candidate.end>=d);
            if (!item) {
              html += '<div class="g-day-event g-day-event-slot" aria-hidden="true">&nbsp;</div>';
              continue;
            }
            const ev=item.ev;
            shown++;
            const t = ev.allDay ? '' : fmt(ev.start) + ' ';
            const multi = spanClass(ev,key);
            const label=(key===ev.spanStart || d===1)
              ? `<span class="multi-label" data-end-day="${item.end}">${ev.title}</span>`
              : '&nbsp;';
            html += `<div class="g-day-event${ev.allDay?' allday':''}${multi}" style="background:${ev.color}" title="${ev.title}">${t}${label}</div>`;
          }
          dayEvts
            .filter(ev=>!ev.allDay || ev.spanStart===ev.spanEnd)
            .slice(0,Math.max(0,MAX-reservedRows))
            .forEach(ev => {
              shown++;
              const t = ev.allDay ? '' : fmt(ev.start) + ' ';
              html += `<div class="g-day-event${ev.allDay?' allday':''}" style="background:${ev.color}" title="${ev.title}">${t}${ev.title}</div>`;
            });
          if (dayEvts.length > shown)
            html += `<div class="g-more">+${dayEvts.length - shown} more</div>`;
          html += '</div>';
        }
        html += '</div>';
      }
    }
  }

  html += '</div>';
  document.getElementById('app').innerHTML = html;
  requestAnimationFrame(sizeYearSpanLabels);

  // Legend
  const leg = document.getElementById('legend');
  const vis = cals.filter(c => isCalEnabled(c.id));
  if (vis.length) {
    leg.style.display = 'flex';
    leg.innerHTML = '<span style="font-weight:600;margin-right:4px;">Calendars:</span>' +
      vis.map(c=>`<span class="leg-item"><span class="leg-dot" style="background:${c.color}"></span>${c.name}</span>`).join('');
  } else { leg.style.display = 'none'; }

  // Scroll today into view
  setTimeout(() => {
    const el = document.querySelector('.g-day.today');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  }, 120);
}

function buildMonth() {
  const first = new Date(year, activeMonth, 1);
  const gridStart = new Date(year, activeMonth, 1 - first.getDay());
  const today = dk(new Date());
  const monthName = first.toLocaleDateString('en-US',{month:'long'});
  let html = `<div class="month-shell"><div class="month-title"><div><h2>${monthName} ${year}</h2><p>A closer look at the month—still read-only, still connected to your calendars.</p></div>
    <button class="hdr-btn" onclick="setView('year')">Back to Year</button></div><div class="month-grid">`;
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>html += `<div class="month-dow">${d}</div>`);
  const weekLanes=Array.from({length:6},(_,week)=>{
    const start=new Date(gridStart); start.setDate(gridStart.getDate()+week*7);
    return monthWeekLanes(start);
  });
  for (let i=0;i<42;i++) {
    const date = new Date(gridStart); date.setDate(gridStart.getDate()+i);
    const key=dk(date), outside=date.getMonth()!==activeMonth;
    const list=(evts[key]||[]).filter(e=>isCalEnabled(e.calId)).sort(eventDisplaySort);
    html += `<div class="month-day${outside?' outside':''}${key===today?' today':''}" onclick="showModal('${key}')"><div class="month-num">${date.getDate()}</div><div class="month-events">`;
    const lanes=weekLanes[Math.floor(i/7)];
    const occupiedRows=Math.min(4,lanes.length);
    let shown=0;
    for(let lane=0; lane<occupiedRows; lane++) {
      const item=lanes[lane].find(candidate=>candidate.start<=i%7 && candidate.end>=i%7);
      if(!item) {
        html += '<div class="month-event month-event-slot" aria-hidden="true">&nbsp;</div>';
        continue;
      }
      const ev=item.ev;
      shown++;
      const multi=monthSpanClass(ev,key);
      html += `<div class="month-event${multi}" style="background:${ev.color}" title="${ev.title}">${monthSpanLabel(ev,key)}</div>`;
    }
    list.filter(ev=>!ev.allDay).slice(0,Math.max(0,4-occupiedRows)).forEach(ev=>{
      const t=ev.allDay?'':fmt(ev.start)+' ';
      html += `<div class="month-event" style="background:${ev.color}" title="${ev.title}">${t}${ev.title}</div>`;
      shown++;
    });
    if(list.length>shown) html += `<div class="g-more">+${list.length-shown} more</div>`;
    html += '</div></div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML=html;
  document.getElementById('legend').style.display='none';
}

// ── Day Modal ──
function showModal(key) {
  const list = (evts[key]||[]).filter(e=>isCalEnabled(e.calId));
  const [y,m,d] = key.split('-').map(Number);
  const dateStr = new Date(y,m-1,d).toLocaleDateString('en-US',
    { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  let h = `<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal">`;
  h += `<button class="modal-x" onclick="this.closest('.modal-bg').remove()">✕</button>`;
  h += `<h3>${dateStr}</h3>`;
  if (!list.length) h += '<p style="color:var(--muted);font-size:13px;">No events this day.</p>';
  else list.forEach(ev => {
    h += `<div class="ev"><div class="ev-title"><span class="ev-dot" style="background:${ev.color}"></span>${ev.title}</div>`;
    if (ev.allDay) h += `<div class="ev-meta">All day · ${ev.calName}</div>`;
    else if (ev.start) h += `<div class="ev-meta">${fmt(ev.start)} · ${ev.calName}</div>`;
    if (ev.location) h += `<div class="ev-meta">📍 ${ev.location}</div>`;
    h += '</div>';
  });
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

// ── Hover Tooltip ──
let tipTarget = null;
function showTip(cell, key) {
  const list = (evts[key] || []).filter(e => isCalEnabled(e.calId));
  if (!list.length) { hideTip(); return; }
  const tip = document.getElementById('tip');
  const [y, m, d] = key.split('-').map(Number);
  const dateStr = new Date(y, m-1, d).toLocaleDateString('en-US',
    { weekday: 'short', month: 'short', day: 'numeric' });
  let h = `<div class="tip-date">${dateStr}</div>`;
  list.slice(0, 7).forEach(ev => {
    const t = ev.allDay ? '' : fmt(ev.start) + ' ';
    h += `<div class="tip-ev"><span class="tip-dot" style="background:${ev.color}"></span><span style="overflow:hidden;text-overflow:ellipsis">${t}${ev.title}</span></div>`;
  });
  if (list.length > 7) h += `<div class="tip-more">+${list.length - 7} more</div>`;
  tip.innerHTML = h;
  tip.style.display = 'block';
  const rect = cell.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = rect.left, top = rect.bottom + 6;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if (top + th > window.innerHeight - 8) top = rect.top - th - 6;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}
function hideTip() {
  document.getElementById('tip').style.display = 'none';
  tipTarget = null;
}
document.addEventListener('mouseover', e => {
  const cell = e.target.closest('.g-day:not(.invalid)');
  if (cell === tipTarget) return;
  if (!cell) { hideTip(); return; }
  tipTarget = cell;
  const oc = cell.getAttribute('onclick') || '';
  const key = (oc.match(/'([^']+)'/) || [])[1];
  if (key) showTip(cell, key);
});
document.addEventListener('mouseout', e => {
  if (!e.relatedTarget || !e.relatedTarget.closest('#tip, .g-day:not(.invalid)')) hideTip();
});

// ── Year Nav ──
function changeYear(y) {
  year = y; document.getElementById('yearLabel').textContent = year;
  if (token) fetchAllEvents(); else (viewMode==='month'?buildMonth():buildGrid());
}

function changePeriod(delta) {
  if (viewMode === 'year') return changeYear(year + delta);
  activeMonth += delta;
  if (activeMonth < 0) { activeMonth = 11; year--; }
  if (activeMonth > 11) { activeMonth = 0; year++; }
  if (token) fetchAllEvents(); else buildMonth();
}

// ── Boot ──
window.addEventListener('load', () => setTimeout(init, 500));
setTimeout(() => {
  if (!document.querySelector('.signin-wrap') &&
      !document.querySelector('.loading') &&
      !document.querySelector('.year-grid')) init();
}, 2500);
</script>
